name: Deploy to Fly.io

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.get_version.outputs.APP_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Debug info
        run: |
          echo "github.ref = ${{ github.ref }}"
          echo "github.ref_type = ${{ github.ref_type }}"
          echo "github.event_name = ${{ github.event_name }}"

      # The Dockerfile base stage owns the Node major; see docs/agents/deploy.md#the-node-major.
      - name: Read the Node major from the Dockerfile
        id: node
        run: |
          major=$(bash scripts/node-major.sh)
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.major }}

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Get version
        id: get_version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build && pnpm run build:server && pnpm prune --prod

  deploy:
    needs: test
    if: contains(github.event.head_commit.message, '[deploy]')
    uses: ./.github/workflows/fly-deploy.yml
    with:
      ref: ${{ github.sha }}
      app_version: ${{ needs.test.outputs.app_version }}
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
