name: Rollback Deployment

# Dispatch this from master, and name the old tag in the version input. A
# same-repo reusable workflow loads from the caller's commit, so a run
# dispatched from master deploys through today's fly-deploy.yml, with
# today's pinned flyctl, and checks out the old tag only to build it. A run
# dispatched from the old tag would use that tag's copy of these files.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag/version to rollback to (e.g., v1.2.3)"
        required: true
        type: string

jobs:
  rollback:
    uses: ./.github/workflows/fly-deploy.yml
    with:
      ref: ${{ inputs.version }}
      app_version: ${{ inputs.version }}
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
